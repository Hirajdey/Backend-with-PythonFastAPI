<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>TodoApp</title> 
        <link rel="stylesheet" type="text/css" href="{{url_for('static', path='/css/base.css')}}">
        <link rel="stylesheet" type="text/css" href="{{url_for('static', path='/css/bootstrap.css')}}">
    </head>
    <body>
        <div class="container">
            <div class="card">
                <div class="card-header">
                    Register
                </div>
                <div class="card-body">
                    <form class="loginForm">
                        <div class="row flex-row justify-content-between">
                            <div class="form-group" style="width:48%">
                                <label>Email</label>
                                <input type="email" class="form-control" name="email" autocomplete="email" required/>
                            </div>
                            <div class="form-group" style="width:48%">
                                <label>Username</label>
                                <input type="text" class="form-control" name="username" autocomplete="username" required/>
                            </div>
                            <div class="form-group" style="width:48%">
                                <label>First Name</label>
                                <input type="text" class="form-control" name="firstname" autocomplete="firstname" required/>
                            </div>
                            <div class="form-group" style="width:48%">
                                <label>Last Name</label>
                                <input type="text" class="form-control" name="lastname" autocomplete="lastname" required/>
                            </div>
                            <div class="form-group" style="width:48%">
                                <label>Role</label>
                                <input type="text" class="form-control" name="role" autocomplete="role" required/>
                            </div>
                            <div class="form-group" style="width:48%">
                                <label>Phone Number</label>
                                <input type="text" class="form-control" name="phonenumber" autocomplete="phonenumber" required/>
                            </div>
                            <div class="form-group" style="width:48%">
                                <label>Password</label>
                                <input type="password" class="form-control" name="password" autocomplete="current-password" required/>
                            </div>
                            <div class="form-group" style="width:48%">
                                <label>Verify Password</label>
                                <input type="password" class="form-control" name="verifypassword" autocomplete="verify-password" required/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>
                <div class="card-footer text-muted">
                    <a href="/auth/login-page"> Already have an account? </a>   
                </div>
            </div>
        </div>    
    </body>
</html>
